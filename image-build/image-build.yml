template:
  - name: resource options
    github_resource_options: &github_resource_options
      type: github-release
      icon: github
      check_every: 30m
    image_resource_options: &image_resource_options
      type: registry-image
      icon: docker

  - name: jobs
    release_get_options: &release_get_options
      trigger: true
      params:
        globs:
          - none
    build_image_params: &build_image_params
      CI_REPO_DIR: container-images-repo
      BUILD_ARGS_FILE: build_args_file
    build_image_config: &build_image_config
      platform: linux
      image_resource: *oci-build-image-resource
      outputs:
        - name: image
      run:
        path: sh
        args:
          - -ec
          - >
            echo VERSION=$(egrep -o '([0-9]{1,}\.)+[0-9]{1,}' ${VERSION_DIR_PATH}/${VERSION_FILE}) > build_args_file &&
            export CONTEXT=${CI_REPO_DIR}/${DOCKER_CONTEXT_DIR} &&
            build
    put_image_params: &put_image_params
      image: image/image.tar
    # Nextcloud: the upstream tag (e.g. 33.0.10-apache) is pushed as an extra tag,
    # written next to the image by the build since it isn't a plain version file.
    nextcloud_build_image_config: &nextcloud_build_image_config
      <<: *build_image_config
      run:
        path: sh
        args:
          - -ec
          - >
            VERSION=$(egrep -o '([0-9]{1,}\.)+[0-9]{1,}' upstream/tag) &&
            echo VERSION=${VERSION} > build_args_file &&
            export CONTEXT=${CI_REPO_DIR}/nextcloud &&
            build &&
            echo ${VERSION}-apache > image/additional_tags
    nextcloud_put_params: &nextcloud_put_params
      <<: *put_image_params
      additional_tags: image/additional_tags

  - name: notifications
    notify-failure: &notify-failure
      put: discord-image
      params:
        message: "**FAILED** :boom: **[${BUILD_PIPELINE_NAME}/${BUILD_JOB_NAME}/${BUILD_NAME}](${BUILD_URL})**"
    job-notifications: &job-notifications
      on_success:
        put: discord-image
        params:
          message: "**SUCCESS** :rocket: **[${BUILD_PIPELINE_NAME}/${BUILD_JOB_NAME}/${BUILD_NAME}](${BUILD_URL})**"
      on_error: *notify-failure
      on_failure: *notify-failure

resource_types:
  - *webhook-resource-type

resources:
  - *discord-image

  - name: &ci_repo container-images-repo
    type: git
    icon: github
    source:
      <<: *github-creds
      uri: https://github.com/FlipEnergy/container-images.git
      branch: main

  # Bitwarden-cli
  - name: &bitwarden_release bitwarden-cli-github-release
    <<: *github_resource_options
    source:
      <<: *github-access-token
      owner: bitwarden
      repository: clients
      tag_filter: cli-.*

  - name: &bitwarden_docker bitwarden-cli-docker-repo
    <<: *image_resource_options
    source:
      <<: *docker-creds
      repository: flipenergy/bitwarden-cli
      tag: latest

  # nextcloud-news-updater
  - name: &nextcloud_news_updater_tag nextcloud-news-updater-tag
    type: git
    icon: github
    source:
      <<: *github-creds
      uri: https://github.com/nextcloud/news-updater.git
      tag_regex: ^(\d+\.)?(\d+\.)?(\*|\d+)$

  - name: &nextcloud_news_updater_docker nextcloud-news-updater-docker-repo
    <<: *image_resource_options
    source:
      <<: *docker-creds
      repository: flipenergy/nextcloud-news-updater
      tag: latest

  # Restic-with-curl
  - name: &restic_release restic-upstream-repo
    <<: *image_resource_options
    check_every: 30m
    source:
      <<: *docker-creds
      repository: restic/restic

  - name: &restic_docker restic-docker-repo
    <<: *image_resource_options
    source:
      <<: *docker-creds
      repository: flipenergy/restic
      tag: latest

  # nextcloud: one upstream/push pair per Nextcloud major. Nextcloud upgrades one
  # major at a time, so keep every major still needed to step k8s-homelab forward
  # and drop old ones once it's past them. A new digest for an existing upstream
  # tag (e.g. a PHP base rebuild) also triggers a rebuild.
  - name: &nextcloud_33_release nextcloud-33-upstream-repo
    <<: *image_resource_options
    check_every: 30m
    source: &nextcloud_upstream_source
      <<: *docker-creds
      repository: nextcloud
      variant: apache
      semver_constraint: ">= 33.0.0, < 34.0.0"

  - name: &nextcloud_33_docker nextcloud-33-docker-repo
    <<: *image_resource_options
    source:
      <<: *docker-creds
      repository: flipenergy/nextcloud
      tag: 33-apache

  - name: &nextcloud_34_release nextcloud-34-upstream-repo
    <<: *image_resource_options
    check_every: 30m
    source:
      <<: *nextcloud_upstream_source
      semver_constraint: ">= 34.0.0, < 35.0.0"

  - name: &nextcloud_34_docker nextcloud-34-docker-repo
    <<: *image_resource_options
    source:
      <<: *docker-creds
      repository: flipenergy/nextcloud
      tag: 34-apache

  - name: &nextcloud_35_release nextcloud-35-upstream-repo
    <<: *image_resource_options
    check_every: 30m
    source:
      <<: *nextcloud_upstream_source
      semver_constraint: ">= 35.0.0, < 36.0.0"

  - name: &nextcloud_35_docker nextcloud-35-docker-repo
    <<: *image_resource_options
    source:
      <<: *docker-creds
      repository: flipenergy/nextcloud
      tag: 35-apache

  # yq
  - name: &yq_release yq-github-release
    <<: *github_resource_options
    source:
      <<: *github-access-token
      owner: mikefarah
      repository: yq

  - name: &yq_docker yq-ubuntu-docker-repo
    <<: *image_resource_options
    source:
      <<: *docker-creds
      repository: flipenergy/yq-ubuntu
      tag: latest

jobs:
  - name: bitwarden-cli-image
    serial: true
    plan:
      - in_parallel:
        - get: *bitwarden_release
          <<: *release_get_options
        - get: *ci_repo

      - task: build-image
        privileged: true
        config:
          <<: *build_image_config
          inputs:
            - name: *bitwarden_release
            - name: *ci_repo
          params:
            <<: *build_image_params
            DOCKER_CONTEXT_DIR: bitwarden-cli
            VERSION_DIR_PATH: *bitwarden_release
            VERSION_FILE: version

      - put: *bitwarden_docker
        no_get: true
        params:
          <<: *put_image_params
          additional_tags: bitwarden-cli-github-release/version
    <<: *job-notifications

  - name: nextcloud-news-updater-image
    serial: true
    plan:
      - in_parallel:
        - get: *nextcloud_news_updater_tag
          trigger: true
        - get: *ci_repo

      - task: build-image
        privileged: true
        config:
          <<: *build_image_config
          inputs:
            - name: *nextcloud_news_updater_tag
            - name: *ci_repo
          params:
            <<: *build_image_params
            DOCKER_CONTEXT_DIR: nextcloud-news-updater
            VERSION_DIR_PATH: *nextcloud_news_updater_tag
            VERSION_FILE: .git/ref

      - put: *nextcloud_news_updater_docker
        no_get: true
        params:
          <<: *put_image_params
          additional_tags: nextcloud-news-updater-tag/.git/ref
    <<: *job-notifications

  - name: restic-image
    serial: true
    plan:
      - in_parallel:
        - get: *restic_release
          trigger: true
        - get: *ci_repo

      - task: build-image
        privileged: true
        config:
          <<: *build_image_config
          inputs:
            - name: *restic_release
            - name: *ci_repo
          params:
            <<: *build_image_params
            DOCKER_CONTEXT_DIR: restic-with-curl
            VERSION_DIR_PATH: *restic_release
            VERSION_FILE: tag

      - put: *restic_docker
        no_get: true
        params:
          <<: *put_image_params
          additional_tags: restic-upstream-repo/tag
    <<: *job-notifications

  - name: nextcloud-33-image
    serial: true
    plan:
      - in_parallel:
        - get: upstream
          resource: *nextcloud_33_release
          trigger: true
          params:
            skip_download: true
        - get: *ci_repo

      - task: build-image
        privileged: true
        config:
          <<: *nextcloud_build_image_config
          inputs:
            - name: upstream
            - name: *ci_repo
          params:
            <<: *build_image_params

      - put: *nextcloud_33_docker
        no_get: true
        params: *nextcloud_put_params
    <<: *job-notifications

  - name: nextcloud-34-image
    serial: true
    plan:
      - in_parallel:
        - get: upstream
          resource: *nextcloud_34_release
          trigger: true
          params:
            skip_download: true
        - get: *ci_repo

      - task: build-image
        privileged: true
        config:
          <<: *nextcloud_build_image_config
          inputs:
            - name: upstream
            - name: *ci_repo
          params:
            <<: *build_image_params

      - put: *nextcloud_34_docker
        no_get: true
        params: *nextcloud_put_params
    <<: *job-notifications

  - name: nextcloud-35-image
    serial: true
    plan:
      - in_parallel:
        - get: upstream
          resource: *nextcloud_35_release
          trigger: true
          params:
            skip_download: true
        - get: *ci_repo

      - task: build-image
        privileged: true
        config:
          <<: *nextcloud_build_image_config
          inputs:
            - name: upstream
            - name: *ci_repo
          params:
            <<: *build_image_params

      - put: *nextcloud_35_docker
        no_get: true
        params: *nextcloud_put_params
    <<: *job-notifications

  - name: yq-ubuntu-image
    serial: true
    plan:
      - in_parallel:
        - get: *yq_release
          <<: *release_get_options
        - get: *ci_repo

      - task: build-image
        privileged: true
        config:
          <<: *build_image_config
          inputs:
            - name: *yq_release
            - name: *ci_repo
          params:
            <<: *build_image_params
            DOCKER_CONTEXT_DIR: yq-ubuntu
            VERSION_DIR_PATH: *yq_release
            VERSION_FILE: version

      - put: *yq_docker
        no_get: true
        params:
          <<: *put_image_params
          additional_tags: yq-github-release/version
    <<: *job-notifications
